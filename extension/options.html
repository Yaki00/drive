<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS Tools Extension Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 520px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        margin-top: 12px;
        border: none;
        border-radius: 6px;
        padding: 10px 14px;
        background: #007648;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
      }
      .ok { color: #1b5e20; }
      .error { color: #b71c1c; }
    </style>
  </head>
  <body>
    <h1>APS Tools Extension</h1>
    <p>Point the extension to your APS Tools API. No login required for now.</p>

    <label for="api-url">API URL</label>
    <input id="api-url" type="url" placeholder="http://localhost:3001" />

    <button id="save" type="button">Save & test connection</button>
    <div id="status" class="status"></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
